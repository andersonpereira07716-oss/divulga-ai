<!DOCTYPE html>
<html lang="pt-BR" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIVULGA AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 dark:bg-darkBg dark:text-slate-100 min-h-screen flex flex-col justify-between pb-16 transition-colors duration-200" id="body-main">
    
    <!-- Topo -->
    <header class="bg-slate-800 dark:bg-darkCard border-b border-slate-700 dark:border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50">
        <div>
            <h1 class="font-bold text-lg tracking-wide text-indigo-400">DIVULGA AI</h1>
            <p class="text-xs text-slate-400">Segurança Enterprise & IA Protegida.</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="alternarTema()" class="text-slate-300 hover:text-white p-2" title="Alternar Tema">
                <i id="icone-tema" class="fa-solid fa-moon text-lg"></i>
            </button>
            <button onclick="abrirAjustes()" class="text-slate-300 hover:text-white p-2" title="Segurança">
                <i class="fa-solid fa-shield-halved text-lg text-emerald-400"></i>
            </button>
        </div>
    </header>

    <!-- Conteúdo Dinâmico -->
    <main id="app-content" class="p-4 max-w-lg mx-auto w-full flex-1">
        <!-- Injetado via JS -->
    </main>

    <!-- Navegação Inferior -->
    <nav class="bg-slate-800 dark:bg-darkCard border-t border-slate-700 dark:border-slate-800 fixed bottom-0 left-0 right-0 flex justify-around p-3 z-50">
        <button onclick="mudarTab('inicio')" id="nav-inicio" class="flex flex-col items-center text-indigo-400 text-xs transition">
            <i class="fa-solid fa-house text-lg mb-1"></i> Início
        </button>
        <button onclick="mudarTab('produtos')" id="nav-produtos" class="flex flex-col items-center text-slate-400 text-xs transition">
            <i class="fa-solid fa-box text-lg mb-1"></i> Produtos
        </button>
        <button onclick="mudarTab('gerar')" id="nav-gerar" class="flex flex-col items-center text-slate-400 text-xs transition">
            <i class="fa-solid fa-wand-magic-sparkles text-lg mb-1"></i> Gerar
        </button>
        <button onclick="mudarTab('agenda')" id="nav-agenda" class="flex flex-col items-center text-slate-400 text-xs transition">
            <i class="fa-solid fa-calendar-days text-lg mb-1"></i> Agenda
        </button>
        <button onclick="mudarTab('historico')" id="nav-historico" class="flex flex-col items-center text-slate-400 text-xs transition">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i> Histórico
        </button>
    </nav>

    <script>
        let tabAtual = 'inicio';
        let produtos = JSON.parse(localStorage.getItem('divulga_produtos')) || [
            { id: 1, nome: 'Nexus Ride (Aplicativo)', tipo: 'Aplicativo', descricao: 'Mobilidade urbana rápida e segura', problema: 'Dificuldade de achar transporte', publico: 'Passageiros urbanos e motoristas', beneficio: 'Corridas seguras com menor taxa', link: 'https://nexusride.app', whatsapp: '5583998765554', preco: '10,00' }
        ];
        let historico = JSON.parse(localStorage.getItem('divulga_historico')) || [];
        let agendamentos = JSON.parse(localStorage.getItem('divulga_agenda')) || [];
        let temaAtual = localStorage.getItem('divulga_tema') || 'dark';

        if (temaAtual === 'light') {
            document.getElementById('html-root').classList.remove('dark');
            document.getElementById('body-main').className = "bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between pb-16 transition-colors duration-200";
        }

        function salvarDados() {
            localStorage.setItem('divulga_produtos', JSON.stringify(produtos));
            localStorage.setItem('divulga_historico', JSON.stringify(historico));
            localStorage.setItem('divulga_agenda', JSON.stringify(agendamentos));
            localStorage.setItem('divulga_tema', temaAtual);
        }

        function alternarTema() {
            const html = document.getElementById('html-root');
            const body = document.getElementById('body-main');
            const icone = document.getElementById('icone-tema');
            
            if (temaAtual === 'dark') {
                temaAtual = 'light';
                html.classList.remove('dark');
                body.className = "bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between pb-16 transition-colors duration-200";
                icone.className = "fa-solid fa-sun text-lg text-amber-500";
            } else {
                temaAtual = 'dark';
                html.classList.add('dark');
                body.className = "bg-slate-900 text-slate-100 dark:bg-darkBg dark:text-slate-100 min-h-screen flex flex-col justify-between pb-16 transition-colors duration-200";
                icone.className = "fa-solid fa-moon text-lg";
            }
            salvarDados();
        }

        function mudarTab(tab) {
            tabAtual = tab;
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-indigo-400', 'text-slate-400'));
            const btn = document.getElementById(`nav-${tab}`);
            if(btn) btn.classList.replace('text-slate-400', 'text-indigo-400');
            render();
        }

        function render() {
            const main = document.getElementById('app-content');
            if (tabAtual === 'inicio') {
                const totalCopies = historico.length;
                const canaisCount = { instagram: 0, whatsapp: 0, story: 0, reels: 0, anuncio: 0 };
                historico.forEach(h => { if(canaisCount[h.canal] !== undefined) canaisCount[h.canal]++; });

                main.innerHTML = `
                    <div class="space-y-6 text-center py-4">
                        <div class="bg-indigo-600/10 dark:bg-indigo-600/20 border border-indigo-500/30 p-6 rounded-2xl shadow-sm">
                            <i class="fa-solid fa-shield-check text-4xl text-emerald-400 mb-3"></i>
                            <h2 class="text-xl font-bold mb-2">DIVULGA AI <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full">Secure 10/10</span></h2>
                            <p class="text-sm text-slate-600 dark:text-slate-300 mb-4">Arquitetura blindada com proxy serverless e proteção contra ameaças.</p>
                            <button onclick="mudarTab('gerar')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl w-full shadow-lg transition">Criar Copies Seguras</button>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 text-left shadow-sm">
                                <span class="text-indigo-500 font-bold text-2xl">${produtos.length}</span>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Produtos Cadastrados</p>
                            </div>
                            <div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 text-left shadow-sm">
                                <span class="text-emerald-500 font-bold text-2xl">${totalCopies}</span>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Copies Geradas</p>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 text-left shadow-sm space-y-3">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-500"><i class="fa-solid fa-chart-pie mr-1"></i> Estatísticas de Uso</h3>
                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-600 dark:text-slate-300">
                                <div class="bg-slate-50 dark:bg-slate-900 p-2.5 rounded-lg border border-slate-100 dark:border-slate-800 flex justify-between"><span>Instagram:</span> <strong class="text-indigo-500">${canaisCount.instagram}</strong></div>
                                <div class="bg-slate-50 dark:bg-slate-900 p-2.5 rounded-lg border border-slate-100 dark:border-slate-800 flex justify-between"><span>WhatsApp:</span> <strong class="text-emerald-500">${canaisCount.whatsapp}</strong></div>
                                <div class="bg-slate-50 dark:bg-slate-900 p-2.5 rounded-lg border border-slate-100 dark:border-slate-800 flex justify-between"><span>Story:</span> <strong class="text-purple-500">${canaisCount.story}</strong></div>
                                <div class="bg-slate-50 dark:bg-slate-900 p-2.5 rounded-lg border border-slate-100 dark:border-slate-800 flex justify-between"><span>Outros:</span> <strong class="text-amber-500">${canaisCount.reels + canaisCount.anuncio}</strong></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabAtual === 'produtos') {
                main.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-lg"><i class="fa-solid fa-box mr-2"></i>Meus Produtos</h2>
                            <button onclick="mostrarModalProduto()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg font-semibold shadow"><i class="fa-solid fa-plus mr-1"></i> Novo</button>
                        </div>
                        <div class="space-y-3">
                            ${produtos.length === 0 ? '<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-8">Nenhum produto cadastrado.</p>' : 
                            produtos.map(p => `
                                <div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 flex justify-between items-center shadow-sm">
                                    <div>
                                        <span class="text-[10px] bg-indigo-500/10 text-indigo-500 px-2 py-0.5 rounded-full font-semibold uppercase">${p.tipo || 'Geral'}</span>
                                        <h3 class="font-bold text-sm mt-1">${p.nome}</h3>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate max-w-[220px]">${p.descricao}</p>
                                    </div>
                                    <button onclick="apagarProduto(${p.id})" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (tabAtual === 'gerar') {
                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="font-bold text-lg"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Central de Criação</h2>
                        <div>
                            <label class="text-xs text-slate-500 dark:text-slate-400 block mb-1">Selecione o Produto:</label>
                            <select id="select-produto" class="w-full bg-white dark:bg-darkCard border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-sm text-slate-800 dark:text-slate-200 shadow-sm">
                                ${produtos.map(p => `<option value="${p.id}">${p.nome} (${p.tipo})</option>`).join('')}
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="gerarCopy('instagram')" class="bg-white dark:bg-darkCard hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold flex items-center justify-center shadow-sm"><i class="fa-brands fa-instagram text-pink-500 mr-2 text-base"></i> Instagram</button>
                            <button onclick="gerarCopy('whatsapp')" class="bg-white dark:bg-darkCard hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold flex items-center justify-center shadow-sm"><i class="fa-brands fa-whatsapp text-emerald-500 mr-2 text-base"></i> WhatsApp</button>
                            <button onclick="gerarCopy('story')" class="bg-white dark:bg-darkCard hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold flex items-center justify-center shadow-sm"><i class="fa-solid fa-mobile-screen text-indigo-500 mr-2 text-base"></i> Story</button>
                            <button onclick="gerarCopy('reels')" class="bg-white dark:bg-darkCard hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold flex items-center justify-center shadow-sm"><i class="fa-solid fa-video text-purple-500 mr-2 text-base"></i> Reels</button>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="gerarCopy('anuncio')" class="bg-white dark:bg-darkCard hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl text-xs font-semibold flex items-center justify-center shadow-sm"><i class="fa-solid fa-rectangle-ad text-amber-500 mr-1.5"></i> Anúncio</button>
                            <button onclick="gerarHashtags()" class="bg-white dark:bg-darkCard hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl text-xs font-semibold flex items-center justify-center shadow-sm"><i class="fa-solid fa-hashtag text-cyan-500 mr-1.5"></i> Tags</button>
                            <button onclick="gerarGanchoEscassez()" class="bg-white dark:bg-darkCard hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl text-xs font-semibold flex items-center justify-center shadow-sm"><i class="fa-solid fa-bolt text-rose-500 mr-1.5"></i> Escassez</button>
                        </div>
                        
                        <div id="resultado-container" class="hidden space-y-3 mt-4 bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-bold text-indigo-500 uppercase tracking-wider">Conteúdo Gerado:</h3>
                                <span id="contador-metricas" class="text-[10px] bg-slate-100 dark:bg-slate-900 px-2 py-0.5 rounded text-slate-500 dark:text-slate-400">0 carateres | 0 palavras</span>
                            </div>
                            
                            <div id="texto-gerado" class="text-sm bg-slate-50 dark:bg-slate-900 p-3 rounded-lg border border-slate-100 dark:border-slate-800 whitespace-pre-wrap max-h-48 overflow-y-auto"></div>
                            
                            <div class="border-t border-slate-100 dark:border-slate-800 pt-3">
                                <p class="text-[10px] font-bold text-slate-400 uppercase mb-1.5"><i class="fa-solid fa-eye mr-1"></i> Pré-visualização do Post / Chat</p>
                                <div id="mockup-visual" class="bg-slate-100 dark:bg-slate-900/80 p-3 rounded-lg border border-slate-200 dark:border-slate-800 text-xs text-slate-700 dark:text-slate-300 italic">
                                    Selecione um canal para visualizar...
                                </div>
                            </div>

                            <div class="flex gap-2 flex-wrap pt-2">
                                <button onclick="copiarTexto()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow"><i class="fa-solid fa-copy mr-1"></i> Copiar</button>
                                <button onclick="partilharWhatsApp()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2.5 rounded-lg shadow"><i class="fa-brands fa-whatsapp mr-1"></i> WhatsApp</button>
                                <button onclick="abrirModalAgendar()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-3 py-2.5 rounded-lg shadow" title="Agendar"><i class="fa-solid fa-calendar-plus"></i></button>
                                <button onclick="baixarTxt()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold px-3 py-2.5 rounded-lg shadow"><i class="fa-solid fa-download"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabAtual === 'agenda') {
                main.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-lg"><i class="fa-solid fa-calendar-days mr-2"></i>Agenda de Campanhas</h2>
                            ${agendamentos.length > 0 ? '<button onclick="limparAgenda()" class="text-xs text-red-400 hover:text-red-300">Limpar</button>' : ''}
                        </div>
                        <div class="space-y-3">
                            ${agendamentos.length === 0 ? '<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-8">Nenhuma campanha agendada.</p>' :
                            agendamentos.map((ag, i) => `
                                <div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2 shadow-sm">
                                    <div class="flex justify-between items-center text-xs text-slate-500 dark:text-slate-400">
                                        <span class="text-indigo-500 font-bold uppercase"><i class="fa-regular fa-clock mr-1"></i> ${ag.dataHora}</span>
                                        <div class="flex gap-2">
                                            <button onclick="dispararCampanhaAgenda(${i})" class="text-emerald-500 hover:text-emerald-400" title="Disparar no WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>
                                            <button onclick="removerAgenda(${i})" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                    <h4 class="font-bold text-sm">${ag.produto} (${ag.canal})</h4>
                                    <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-2">${ag.texto}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (tabAtual === 'historico') {
                main.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-lg"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Histórico</h2>
                            ${historico.length > 0 ? '<button onclick="limparHistorico()" class="text-xs text-red-400 hover:text-red-300">Limpar</button>' : ''}
                        </div>
                        <div class="space-y-3">
                            ${historico.length === 0 ? '<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-8">Nenhuma copy gerada ainda.</p>' :
                            historico.map((h, i) => `
                                <div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 space-y-2 shadow-sm">
                                    <div class="flex justify-between items-center text-xs text-slate-500 dark:text-slate-400">
                                        <span class="text-indigo-500 font-bold uppercase">${h.canal} (${h.produto})</span>
                                        <span>${h.data}</span>
                                    </div>
                                    <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-3">${h.texto}</p>
                                    <button onclick="copiarHistorico(${i})" class="text-xs text-indigo-500 font-semibold hover:underline"><i class="fa-solid fa-copy mr-1"></i> Copiar novamente</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (tabAtual === 'ajustes') {
                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="font-bold text-lg"><i class="fa-solid fa-shield-halved mr-2"></i>Segurança & Status</h2>
                        <div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm text-xs">
                            <div class="flex items-center justify-between bg-emerald-500/10 p-3 rounded-lg border border-emerald-500/20 text-emerald-400 font-semibold">
                                <span><i class="fa-solid fa-check-circle mr-1"></i> Proxy Serverless Ativo</span>
                                <span>10/10</span>
                            </div>
                            <p class="text-slate-500 dark:text-slate-400 leading-relaxed">
                                A chave de API do Gemini está protegida no servidor (Variáveis de Ambiente da Vercel). Nenhum dado sensível está exposto no navegador.
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        function atualizarMetricasEPreview(texto, canal, produtoNome) {
            window.copiaAtual = texto;
            window.produtoAtualNome = produtoNome;
            window.canalAtual = canal;

            const resContainer = document.getElementById('resultado-container');
            const textoDiv = document.getElementById('texto-gerado');
            const contadorDiv = document.getElementById('contador-metricas');
            const mockupDiv = document.getElementById('mockup-visual');

            resContainer.classList.remove('hidden');
            textoDiv.innerHTML = texto;

            const carateres = texto.length;
            const palavras = texto.trim() ? texto.trim().split(/\s+/).length : 0;
            contadorDiv.innerText = `${carateres} carateres | ${palavras} palavras`;

            mockupDiv.innerHTML = `💬 <b>${produtoNome}</b> [${canal.toUpperCase()}]:<br>"${texto.replace(/\n/g, '<br>')}"`;

            historico.unshift({
                produto: produtoNome,
                canal: canal,
                texto: texto,
                data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            if(historico.length > 30) historico.pop();
            salvarDados();
        }

        async function gerarCopy(canal) {
            const produtoId = document.getElementById('select-produto').value;
            const produto = produtos.find(p => p.id == produtoId);
            if (!produto) return alert('Selecione um produto válido!');

            const resContainer = document.getElementById('resultado-container');
            const textoDiv = document.getElementById('texto-gerado');
            resContainer.classList.remove('hidden');
            textoDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> A gerar copy segura via servidor...';

            const prompt = `Crie uma copy profissional de marketing para o canal ${canal}.
Informações do Produto:
- Nome: ${produto.nome}
- Tipo: ${produto.tipo}
- Descrição: ${produto.descricao}
- Problema que resolve: ${produto.problema}
- Público-alvo: ${produto.publico}
- Principal benefício: ${produto.beneficio}
- Link/Contato: ${produto.link || produto.whatsapp}
- Preço: ${produto.preco}`;

            const systemInstruction = "Você é um especialista sénior em copywriting e marketing digital. Crie textos persuasivos, diretos e prontos para conversão.";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, systemInstruction })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                atualizarMetricasEPreview(data.text, canal, produto.nome);
            } catch (e) {
                textoDiv.innerHTML = 'Erro seguro: ' + (e.message || 'Falha ao comunicar com o servidor.');
            }
        }

        function gerarHashtags() {
            const produtoId = document.getElementById('select-produto').value;
            const produto = produtos.find(p => p.id == produtoId);
            if (!produto) return alert('Selecione um produto válido!');

            const nomeClean = produto.nome.replace(/[^a-zA-Z0-9]/g, '');
            const tipoClean = produto.tipo.replace(/[^a-zA-Z0-9]/g, '');
            const tags = `#${nomeClean} #${tipoClean} #Inovação #Tecnologia #Negócios #Empreendedorismo #MarketingDigital #Promoção #Brasil #${produto.tipo.toLowerCase()}`;
            atualizarMetricasEPreview(tags, 'hashtags', produto.nome);
        }

        function gerarGanchoEscassez() {
            const produtoId = document.getElementById('select-produto').value;
            const produto = produtos.find(p => p.id == produtoId);
            if (!produto) return alert('Selecione um produto válido!');

            const escassez = `🚨 **ATENÇÃO: ÚLTIMAS VAGAS / UNIDADES!**\n\nA procura pelo **${produto.nome}** disparou! Se quer garantir ${produto.beneficio.toLowerCase()} para ${produto.publico}, precisa agir AGORA.\n\n💰 Apenas: R$ ${produto.preco || 'Consulte'}\n🔗 ${produto.link || produto.whatsapp}`;
            atualizarMetricasEPreview(escassez, 'escassez', produto.nome);
        }

        function copiarTexto() {
            navigator.clipboard.writeText(window.copiaAtual || '');
            alert('Conteúdo copiado com segurança!');
        }

        function copiarHistorico(index) {
            navigator.clipboard.writeText(historico[index].texto);
            alert('Conteúdo copiado!');
        }

        function partilharWhatsApp() {
            const textoEncoded = encodeURIComponent(window.copiaAtual || '');
            window.open(`https://api.whatsapp.com/send?text=${textoEncoded}`, '_blank');
        }

        function dispararCampanhaAgenda(index) {
            const ag = agendamentos[index];
            const textoEncoded = encodeURIComponent(ag.texto);
            window.open(`https://api.whatsapp.com/send?text=${textoEncoded}`, '_blank');
        }

        function baixarTxt() {
            const blob = new Blob([window.copiaAtual || ''], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'conteudo-divulga-ai.txt';
            a.click();
        }

        function abrirModalAgendar() {
            const dataHora = prompt('Digite a data e horário para o lembrete (ex: 29/09/2026 às 10:00):');
            if (!dataHora) return;

            agendamentos.push({
                produto: window.produtoAtualNome || 'Geral',
                canal: window.canalAtual || 'Campanha',
                texto: window.copiaAtual || '',
                dataHora
            });
            salvarDados();
            alert('Campanha agendada com sucesso!');
        }

        function removerAgenda(index) {
            if(confirm('Deseja remover este agendamento?')) {
                agendamentos.splice(index, 1);
                salvarDados();
                render();
            }
        }

        function limparAgenda() {
            if(confirm('Deseja limpar toda a agenda?')) {
                agendamentos = [];
                salvarDados();
                render();
            }
        }

        function limparHistorico() {
            if(confirm('Deseja limpar todo o histórico?')) {
                historico = [];
                salvarDados();
                render();
            }
        }

        function mostrarModalProduto() {
            const nome = prompt('Nome do Produto/Projeto:');
            if (!nome) return;
            const tipo = prompt('Tipo (Aplicativo, E-book, SaaS, Serviço):') || 'Aplicativo';
            const descricao = prompt('Breve Descrição:') || '';
            const problema = prompt('Qual problema resolve?') || '';
            const publico = prompt('Público-alvo:') || '';
            const beneficio = prompt('Principal benefício:') || '';
            const link = prompt('Link de acesso ou Venda:') || '';
            const whatsapp = prompt('Número de WhatsApp (com DDD):') || '';
            const preco = prompt('Preço (ex: 49,90):') || '';

            produtos.push({
                id: Date.now(),
                nome, tipo, descricao, problema, publico, beneficio, link, whatsapp, preco
            });
            salvarDados();
            render();
            mudarTab('produtos');
        }

        function apagarProduto(id) {
            if(confirm('Deseja apagar este produto?')) {
                produtos = produtos.filter(p => p.id !== id);
                salvarDados();
                render();
            }
        }

        function abrirAjustes() {
            mudarTab('ajustes');
        }

        render();
    </script>
</body>
</html>
